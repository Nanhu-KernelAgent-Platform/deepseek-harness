- id: cli-mock-llm
  name: './mock-llm.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cli-mock
              model: cli-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless headless-agent smoke.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'

- id: kernelagent-config
  name: ../../../../../scratch-plugin/src/kernelagent-config-tool.ts
  config:
    apiKey: fixture-key
    autoOptimize: true
    generationMaxRounds: 3
    maxRounds: 7
- id: kernelagent-describe
  name: ../../../../../scratch-plugin/src/kernelagent-describe-tool.ts
- id: kernelagent
  name: ../../../../../scratch-plugin/src/kernelagent-tool.ts
